apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "midnight-crossed-books.serviceAccountName" . | quote }}
  labels:
    {{- include "midnight-crossed-books.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required" .Values.serviceAccount.roleArn | quote }}
automountServiceAccountToken: false
