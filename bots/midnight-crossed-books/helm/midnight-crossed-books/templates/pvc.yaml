apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "midnight-crossed-books.stateClaimName" . | quote }}
  labels:
    {{- include "midnight-crossed-books.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ required "state.storageClass is required" .Values.state.storageClass | quote }}
  resources:
    requests:
      storage: {{ required "state.size is required" .Values.state.size | quote }}
