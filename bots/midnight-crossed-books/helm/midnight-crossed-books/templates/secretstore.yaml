apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "midnight-crossed-books.secretStoreName" . | quote }}
  labels:
    {{- include "midnight-crossed-books.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "midnight-crossed-books.serviceAccountName" . | quote }}
