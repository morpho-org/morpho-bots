name: blue_liquidation
description: >-
  Indexes the single Morpho Blue event the liquidation bot needs for borrower discovery on Base:
  `Borrow`. It is the only path that creates debt and its indexed `onBehalf` is the position owner,
  so the bot takes the distinct (market id, onBehalf) set as the candidate universe and lets the
  on-chain lens filter to actually-liquidatable positions (over-inclusion is harmless; under-inclusion
  would miss liquidations). MarketParams (loanToken, collateralToken, oracle, irm, lltv) are recovered
  ON-CHAIN via `idToMarketParams(id)` on the singleton — NOT indexed. `CreateMarket` is deliberately
  NOT indexed: no-code rindexer cannot decode the nested `MarketParams` struct it carries (it panics
  with "CustomStruct ... not supported"), and since the singleton exposes `idToMarketParams` the event
  is unnecessary anyway.
project_type: no-code
networks:
  - name: base
    chain_id: 8453
    rpc: ${RINDEXER_RPC_URL}
    # Cap per-request getLogs range. Sized for the Morpho eRPC `/cache` endpoint (wide-range friendly)
    # during the historical backfill — without it rindexer probes, hits the endpoint's max-range error,
    # and falls back to tiny 5000-block chunks, making the ~34M-block backfill glacial. For steady-state
    # live indexing on `/realtime` (small ranges near the tip) this cap never binds, so it is safe to
    # leave set across the /cache→/realtime switch.
    max_block_range: 150000

storage:
  postgres:
    enabled: true

contracts:
  - name: Morpho
    details:
      - network: base
        address: '0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb'
        # Morpho Blue singleton deployment block on Base — VERIFIED via getCode (no code at
        # 13977147, code at 13977148), so this indexes from the singleton's first block: no early
        # markets/borrowers are missed.
        start_block: 13977148
    abi: ./abis/morpho.abi.json
    include_events:
      - Borrow
