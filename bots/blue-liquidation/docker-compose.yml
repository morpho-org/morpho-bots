# Bundles the per-chain bots with ONE shared rindexer instance + Postgres for borrower discovery.
# rindexer indexes the Morpho Blue `Borrow` event (per rindexer.yaml) for every chain into one
# Postgres, discriminated by a `network` column; each bot reads the indexed (market, borrower) pairs
# for its own chain each tick. Build context is the repo root so the bun workspace (packages/*)
# resolves — see Dockerfile. Set the chainId-suffixed RPCs (RPC_URL_8453, RPC_URL_4663, optionally
# RINDEXER_RPC_URL_<chainId>) and a LIQUIDATOR_PRIVATE_KEY.
#
# NOTE: the rindexer service config (image command, env) follows the rindexer docs but has not been
# run end-to-end here; verify `docker compose up` against live RPCs before relying on it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rindexer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rindexer}
      POSTGRES_DB: blue_liquidation
    volumes:
      - rindexer-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rindexer -d blue_liquidation']
      interval: 5s
      timeout: 5s
      retries: 10

  rindexer:
    # Derived from the upstream rindexer image with rindexer.yaml + the generated event ABI baked in
    # (see Dockerfile `rindexer` target), so no host bind mount is needed and the ABI isn't committed.
    build:
      context: ../..
      dockerfile: bots/blue-liquidation/Dockerfile
      target: rindexer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rindexer:${POSTGRES_PASSWORD:-rindexer}@postgres:5432/blue_liquidation
      # One shared indexer for both networks; each reads its own RPC (matches the ${RINDEXER_RPC_URL_*}
      # interpolations in rindexer.yaml). Defaults to that chain's bot RPC; Robinhood to its public RPC.
      RINDEXER_RPC_URL_8453: ${RINDEXER_RPC_URL_8453:-${RPC_URL_8453:?set RPC_URL_8453 or RINDEXER_RPC_URL_8453}}
      RINDEXER_RPC_URL_4663: ${RINDEXER_RPC_URL_4663:-${RPC_URL_4663:-https://rpc.mainnet.chain.robinhood.com}}
      PROJECT_PATH: /app/project_path
    # Mirrors the baked `CMD ["start","indexer"]` in the Dockerfile `rindexer` stage (keep in sync).
    command: ['start', 'indexer']
    restart: unless-stopped

  bot-base:
    build:
      context: ../..
      dockerfile: bots/blue-liquidation/Dockerfile
      target: bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHAIN_ID: '8453'
      RPC_URL: ${RPC_URL_8453:?set RPC_URL_8453}
      LIQUIDATOR_PRIVATE_KEY: ${LIQUIDATOR_PRIVATE_KEY:?set LIQUIDATOR_PRIVATE_KEY}
      EXECUTOOOR_ADDRESS: ${EXECUTOOOR_ADDRESS:-}
      SWAP_CONFIG_PATH: /config/swap.json
      ZEROX_API_KEY: ${ZEROX_API_KEY:-}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY:-}
      # The bot reads rindexer's indexed events (filtered to network=base) from the same Postgres.
      DATABASE_URL: postgresql://rindexer:${POSTGRES_PASSWORD:-rindexer}@postgres:5432/blue_liquidation
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional BetterStack log forwarding (vector.yaml). Empty = disabled; the entrypoint only starts
      # the Vector side-car when the token is set (host also required), else behaves exactly as before.
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST:-}
    volumes:
      - ${SWAP_CONFIG_PATH:-./swap.config.json}:/config/swap.json:ro
    restart: unless-stopped

  # Robinhood launches DETECTION-ONLY: no swap route configured (no SWAP_CONFIG_PATH/volume), so the
  # bot discovers + logs liquidatable positions but skips every routed liquidation. It still needs the
  # Executor deployed on Robinhood (deploy:executor) to pass the startup liveness gate.
  bot-robinhood:
    build:
      context: ../..
      dockerfile: bots/blue-liquidation/Dockerfile
      target: bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHAIN_ID: '4663'
      RPC_URL: ${RPC_URL_4663:-https://rpc.mainnet.chain.robinhood.com}
      LIQUIDATOR_PRIVATE_KEY: ${LIQUIDATOR_PRIVATE_KEY:?set LIQUIDATOR_PRIVATE_KEY}
      EXECUTOOOR_ADDRESS: ${EXECUTOOOR_ADDRESS:-}
      # The bot reads rindexer's indexed events (filtered to network=robinhood) from the same Postgres.
      DATABASE_URL: postgresql://rindexer:${POSTGRES_PASSWORD:-rindexer}@postgres:5432/blue_liquidation
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional BetterStack log forwarding (vector.yaml). Empty = disabled; both blue chains share the
      # one blue source, discriminated by the bot/chainId fields Vector stamps.
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST:-}
    restart: unless-stopped

volumes:
  rindexer-pg:
