apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "blue-liquidation.runtimeSecretName" . | quote }}
  labels:
    {{- include "blue-liquidation.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.runtimeSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "blue-liquidation.secretStoreName" . | quote }}
    kind: SecretStore
  target:
    name: {{ include "blue-liquidation.runtimeSecretName" . | quote }}
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - extract:
        key: {{ required "runtimeSecret.key is required" .Values.runtimeSecret.key | quote }}
