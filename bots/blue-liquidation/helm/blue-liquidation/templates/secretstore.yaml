apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "blue-liquidation.secretStoreName" . | quote }}
  labels:
    {{- include "blue-liquidation.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "blue-liquidation.serviceAccountName" . | quote }}
