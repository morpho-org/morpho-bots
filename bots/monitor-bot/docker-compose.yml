services:
  bot:
    build:
      context: ../..
      dockerfile: bots/monitor-bot/Dockerfile
    environment:
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST:-}
      BETTERSTACK_HEARTBEAT_URL: ${BETTERSTACK_HEARTBEAT_URL:-}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    restart: unless-stopped
