# Bundles the per-chain blue bots with ONE shared rindexer instance + Postgres for borrower
# discovery. rindexer indexes the Morpho Blue `Borrow` event (services/blue-rindexer/rindexer.yaml)
# for every chain into one Postgres, discriminated by a `network` column; each bot tick reads the
# indexed (market, borrower) pairs for its own chain. Bots run the three-stage `sense | act | queue`
# pipeline in the image's entrypoint loop (bots/docker-entrypoint.sh); stdout carries JSON-Lines
# records, logs go to stderr. Set the chainId-suffixed RPCs (RPC_URL_8453, RPC_URL_4663, optionally
# RINDEXER_RPC_URL_<chainId>), a LIQUIDATOR_PRIVATE_KEY, and the matching LIQUIDATOR_ADDRESS (the
# skim recipient `act` targets — must be the address that private key derives).
#
# Build contexts are `..` (the repo root — required for the bun workspace to resolve) because this
# file lives in bots/; run it from anywhere: `docker compose -f bots/docker-compose.blue.yml up`.
#
# NOTE: the rindexer service config (image command, env) follows the rindexer docs but has not been
# run end-to-end here; verify `docker compose up` against live RPCs before relying on it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rindexer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rindexer}
      POSTGRES_DB: blue_liquidation
    volumes:
      - rindexer-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rindexer -d blue_liquidation']
      interval: 5s
      timeout: 5s
      retries: 10

  rindexer:
    # Derived from the upstream rindexer image with rindexer.yaml + the generated event ABI baked in
    # (see services/blue-rindexer/Dockerfile), so no host bind mount is needed and the ABI isn't
    # committed.
    build:
      context: ..
      dockerfile: services/blue-rindexer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rindexer:${POSTGRES_PASSWORD:-rindexer}@postgres:5432/blue_liquidation
      # One shared indexer for both networks; each reads its own RPC (matches the ${RINDEXER_RPC_URL_*}
      # interpolations in rindexer.yaml). Defaults to that chain's bot RPC; Robinhood to its public RPC.
      RINDEXER_RPC_URL_8453: ${RINDEXER_RPC_URL_8453:-${RPC_URL_8453:?set RPC_URL_8453 or RINDEXER_RPC_URL_8453}}
      RINDEXER_RPC_URL_4663: ${RINDEXER_RPC_URL_4663:-${RPC_URL_4663:-https://rpc.mainnet.chain.robinhood.com}}
      PROJECT_PATH: /app/project_path
    # Mirrors the baked `CMD ["start","indexer"]` in the Dockerfile (keep in sync).
    command: ['start', 'indexer']
    restart: unless-stopped

  bot-base:
    build:
      context: ..
      dockerfile: bots/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT: blue
      CHAIN_ID: '8453'
      TICK_INTERVAL_S: ${TICK_INTERVAL_S:-2}
      RPC_URL: ${RPC_URL_8453:?set RPC_URL_8453}
      LIQUIDATOR_PRIVATE_KEY: ${LIQUIDATOR_PRIVATE_KEY:?set LIQUIDATOR_PRIVATE_KEY}
      # `act` skims to this EOA and simulates `from` it (secret-free — the key lives only in `queue`);
      # it must be the address the private key above derives, else act/queue target different wallets.
      LIQUIDATOR_ADDRESS: ${LIQUIDATOR_ADDRESS:?set LIQUIDATOR_ADDRESS}
      EXECUTOOOR_ADDRESS: ${EXECUTOOOR_ADDRESS:-}
      SWAP_CONFIG_PATH: /data/morpho-bots/blue/swap-config.json
      ZEROX_API_KEY: ${ZEROX_API_KEY:-}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY:-}
      # The bot reads rindexer's indexed events (filtered to network=base) from the same Postgres.
      DATABASE_URL: postgresql://rindexer:${POSTGRES_PASSWORD:-rindexer}@postgres:5432/blue_liquidation
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # One /data volume carries both the cross-tick state files and the swap config.
      - bot-base-data:/data
      - ${SWAP_CONFIG_PATH:-../packages/blue-liquidation/configs/example.json}:/data/morpho-bots/blue/swap-config.json:ro
    restart: unless-stopped

  # Robinhood launches DETECTION-ONLY: no swap route configured (no SWAP_CONFIG_PATH), so the bot
  # discovers + logs liquidatable positions but skips every routed liquidation. It still needs the
  # Executor deployed on Robinhood (deploy:executor) to pass the startup liveness gate.
  bot-robinhood:
    build:
      context: ..
      dockerfile: bots/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT: blue
      CHAIN_ID: '4663'
      TICK_INTERVAL_S: ${TICK_INTERVAL_S:-2}
      RPC_URL: ${RPC_URL_4663:-https://rpc.mainnet.chain.robinhood.com}
      LIQUIDATOR_PRIVATE_KEY: ${LIQUIDATOR_PRIVATE_KEY:?set LIQUIDATOR_PRIVATE_KEY}
      # Must be the address the private key above derives (see bot-base).
      LIQUIDATOR_ADDRESS: ${LIQUIDATOR_ADDRESS:?set LIQUIDATOR_ADDRESS}
      EXECUTOOOR_ADDRESS: ${EXECUTOOOR_ADDRESS:-}
      # The bot reads rindexer's indexed events (filtered to network=robinhood) from the same Postgres.
      DATABASE_URL: postgresql://rindexer:${POSTGRES_PASSWORD:-rindexer}@postgres:5432/blue_liquidation
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - bot-robinhood-data:/data
    restart: unless-stopped

volumes:
  rindexer-pg:
  bot-base-data:
  bot-robinhood-data:
