replicas: 1

image:
  repository: ''
  # Accepts an immutable tag or a tag@sha256 digest reference.
  tag: ''
  pullPolicy: IfNotPresent

serviceAccount:
  name: ''
  roleArn: ''

runtimeSecret:
  key: ''
  refreshInterval: 5m

# Non-secret settings; the README's "Release values" lists the ones every release sets.
env: []

# Holds the kernel ledger and the journal. The claim survives uninstall.
state:
  storageClass: tools-gp3
  size: 10Gi

# A stop lets the kernel settle what it has in flight; the default 30s can kill a clean stop.
terminationGracePeriodSeconds: 120

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
