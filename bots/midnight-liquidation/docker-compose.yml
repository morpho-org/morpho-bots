# Runs the midnight-liquidation bot. Borrower candidates come from the markets liquidation-candidates
# HTTP API (LIQUIDATION_CANDIDATES_API_URL, public by default), so there is no indexer or database to
# run. The bot's build context is the repo root so the bun workspace (packages/*) resolves — see
# Dockerfile.
services:
  bot:
    build:
      context: ../..
      dockerfile: bots/midnight-liquidation/Dockerfile
    environment:
      CHAIN_ID: '8453'
      RPC_URL: ${RPC_URL:?set RPC_URL}
      LIQUIDATOR_PRIVATE_KEY: ${LIQUIDATOR_PRIVATE_KEY:?set LIQUIDATOR_PRIVATE_KEY}
      EXECUTOOOR_ADDRESS: ${EXECUTOOOR_ADDRESS:-}
      # Venues are enabled by the presence of their API key. With neither set, the bot refuses to
      # start unless ALLOW_BAD_DEBT_ONLY=true (then it runs bad-debt-only).
      ZEROX_API_KEY: ${ZEROX_API_KEY:-}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY:-}
      ALLOW_BAD_DEBT_ONLY: ${ALLOW_BAD_DEBT_ONLY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional BetterStack log shipping (in-process loglayer transport). Empty = disabled; the bot
      # ships its structured logs only when BOTH are set (host also required), else behaves as before.
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST:-}
      BETTERSTACK_HEARTBEAT_URL: ${BETTERSTACK_HEARTBEAT_URL:-}
    restart: unless-stopped
