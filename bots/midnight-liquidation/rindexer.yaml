name: midnight_liquidation
description: >-
  Indexes the Midnight Take event the liquidation bot needs for borrower discovery on Base. `take`
  is the only path that creates debt, and the debtor is the offer's seller — `taker` when
  `offerIsBuy` else `maker` — so the bot unions both indexed addresses as the candidate
  (market id, borrower) universe and lets the on-chain lens filter to actually-liquidatable positions
  (over-inclusion is harmless; under-inclusion would miss liquidations). The full Market config
  (loan token, per-collateral lltv/maxLif/oracle, maturity, rcfThreshold, gates) is read on-chain by
  the lens via toMarket(id), so no market-creation event is indexed here.
project_type: no-code
networks:
  - name: base
    chain_id: 8453
    rpc: ${RINDEXER_RPC_URL}

storage:
  postgres:
    enabled: true

contracts:
  - name: Midnight
    details:
      - network: base
        address: '0xAdedD8ab6dE832766Fedf0FaC4992E5C4D3EA18A'
        start_block: 48286884
    abi: ./abis/midnight.abi.json
    include_events:
      - Take
