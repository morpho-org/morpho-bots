# Runs the quoter-bot combined monitor (`mm start --verbose`). Copy quoter-bot.example.yaml to
# quoter-bot.yaml next to this file (gitignored, chmod 600) and edit it; every environment variable
# exported in the invoking shell overrides its YAML counterpart. The build context is the repo root
# so the pnpm workspace (packages/*) resolves — see Dockerfile.
services:
  bot:
    build:
      context: ../..
      dockerfile: bots/quoter-bot/Dockerfile
    # The image has no ENTRYPOINT (the railway entrypoint lives in CMD and forwards its args to
    # the bot after repairing /state ownership and dropping privileges), so the command carries the
    # full invocation.
    command:
      [
        '/usr/local/sbin/railway-entrypoint.sh',
        '--config',
        '/config/quoter-bot.yaml',
        'start',
        '--verbose'
      ]
    volumes:
      - type: bind
        source: ./quoter-bot.yaml
        target: /config/quoter-bot.yaml
        read_only: true
        bind:
          # Fail loud when quoter-bot.yaml is missing instead of mounting an empty directory.
          create_host_path: false
      # Optional encrypted keystore. Set KEYSTORE_HOST_PATH to the host file and set the bot's
      # KEYSTORE_PATH to /run/secrets/quoter-bot-keystore.json. /dev/null keeps non-keystore
      # deployments source-compatible without exposing another host path inside the container.
      - type: bind
        source: ${KEYSTORE_HOST_PATH:-/dev/null}
        target: /run/secrets/quoter-bot-keystore.json
        read_only: true
        bind:
          create_host_path: false
      # Durable offer-group ownership state (XDG_STATE_HOME=/state, set by the Dockerfile). It must
      # outlive the container: recreating without it makes the bot forget which live on-chain offer
      # groups it owns, so it treats its own offers as foreign and cannot clean them up.
      - type: volume
        source: quoter-bot-state
        target: /state
    # Null-valued entries pass a variable through ONLY when the invoking shell sets it. Never use
    # `${VAR:-}` defaults here: they set empty strings, and any SET variable — even empty — replaces
    # the YAML value and fails validation with "Missing required env var".
    environment:
      # The image does not pin the state home; point it at the mounted volume explicitly.
      XDG_STATE_HOME: /state
      CHAIN_ID:
      RPC_URL:
      REFERENCE_RPC_URL:
      MAKER_PRIVATE_KEY:
      # Signer sources beyond the raw key: encrypted keystore or AWS KMS (see README Run section).
      KEY_STORAGE_METHOD:
      KEYSTORE_PATH:
      KEYSTORE_PASSWORD:
      KEYSTORE_INTERACTIVE:
      AWS_KMS_KEY_ID:
      AWS_REGION:
      # Standard AWS SDK environment credentials for KMS. Session tokens are optional, but must be
      # forwarded when temporary STS credentials are used.
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      MAKER_ADDRESS:
      MIDNIGHT_ADDRESS:
      LOAN_ASSET_ADDRESS:
      RATIFIER_ADDRESS:
      MARKET_IDS:
      REFERENCE_MARKET_ID:
      NATIVE_RESERVE_WEI:
      MAXIMUM_LEND_EXPOSURE_ASSETS:
      MORPHO_API_BASE_URL:
      ROUTER_API_BASE_URL:
      V0_OFFER_GROUP_IDS:
      REQUEST_TIMEOUT_MS:
      TRANSACTION_RECEIPT_TIMEOUT_MS:
      BOOTSTRAP_MARKETS:
      LADDER_MARKETS:
      # Optional Better Stack shipping/heartbeat; both shipping values must be set together.
      BETTERSTACK_SOURCE_TOKEN:
      BETTERSTACK_INGESTING_HOST:
      BETTERSTACK_HEARTBEAT_URL:
    # SIGTERM triggers graceful shutdown: the monitors drain the in-flight cycle, then cancel owned
    # offers on-chain serially and wait for each receipt, bounded per transaction by
    # TRANSACTION_RECEIPT_TIMEOUT_MS (default 3m, max 15m). Compose escalates to SIGKILL when the
    # grace period lapses, cutting cleanup off — raise STOP_GRACE_PERIOD beyond the default when
    # configuring long receipt timeouts or many owned groups.
    stop_grace_period: ${STOP_GRACE_PERIOD:-15m}
    restart: unless-stopped

volumes:
  quoter-bot-state:
