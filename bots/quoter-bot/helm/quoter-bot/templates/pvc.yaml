{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# Holds the bot's durable offer-group ownership state (XDG_STATE_HOME). Deleting it makes
# previously bot-issued groups unknown, which fails readiness until an operator invalidates or
# adopts them, so the claim is kept on uninstall by default (persistence.retain).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quoter-bot.fullname" . }}-state
  labels:
    {{- include "quoter-bot.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.persistence.retain }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  {{- if eq "-" .Values.persistence.storageClass }}
  storageClassName: ''
  {{- else }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}
