{{- /*
A kept claim survives uninstall as an unmanaged resource. The name-scoped lookup suppresses
rendering only in the install-over-orphan case (.Release.IsInstall with the claim already
present), so a same-name reinstall mounts the orphan instead of colliding with a fresh create.
Upgrades always render the claim: it stays release-managed (no pruning with retain=false, and
size/annotation changes keep reconciling), and the first upgrade after an adoption install
re-adopts the orphan through its matching release annotations. lookup is empty under
`helm template`, where the claim always renders.
*/}}
{{- $existingState := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (include "quoter-bot.stateClaimName" .) }}
{{- $suppressForAdoption := and .Release.IsInstall $existingState }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (not $suppressForAdoption) }}
# Holds the bot's durable offer-group ownership state (XDG_STATE_HOME). Deleting it makes
# previously bot-issued groups unknown, which fails readiness until an operator invalidates or
# adopts them, so the claim is kept on uninstall by default (persistence.retain).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Quoted: a numeric-looking override must stay a YAML string.
  name: {{ include "quoter-bot.stateClaimName" . | quote }}
  labels:
    {{- include "quoter-bot.labels" . | nindent 4 }}
  {{- $pvcAnnotations := .Values.persistence.annotations }}
  {{- if .Values.persistence.retain }}
  {{- $pvcAnnotations = omit $pvcAnnotations "helm.sh/resource-policy" }}
  {{- end }}
  {{- if or .Values.persistence.retain $pvcAnnotations }}
  annotations:
    {{- with $pvcAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.persistence.retain }}
    # Reserved while retain is true: custom annotations cannot override the keep policy that
    # protects the ownership-state claim from deletion on uninstall.
    helm.sh/resource-policy: keep
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  {{- if eq "-" .Values.persistence.storageClass }}
  storageClassName: ''
  {{- else }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}
