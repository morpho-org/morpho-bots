apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quoter-bot.fullname" . }}
  labels:
    {{- include "quoter-bot.labels" . | nindent 4 }}
spec:
  # The bot is a singleton writer: its nonce cursor, serialized mutation queue, and durable
  # offer-group ownership state are per-instance, so two replicas against one maker would race
  # nonces and fight over the offer book. A StatefulSet enforces at-most-one across rollouts,
  # graceful pod deletion, and eviction, because it never creates the replacement pod until the
  # old one is confirmed fully terminated — which matters during the deliberately long SIGTERM
  # offer-cleanup drain. A Deployment (even with Recreate) only guarantees that for rollouts.
  # Kubernetes documents one escape hatch that breaks this guarantee: force deletion
  # (kubectl delete pod --force --grace-period=0, or force-deleting a partitioned Node). The
  # bot deliberately has no Kubernetes API access or external writer lock, so never force
  # delete; fence a failed node before letting the controller replace the pod.
  replicas: 1
  serviceName: {{ include "quoter-bot.fullname" . }}
  selector:
    matchLabels:
      {{- include "quoter-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $chartManagedConfig := and .Values.config (not .Values.existingConfigSecret) }}
      {{- $podAnnotations := omit .Values.podAnnotations "checksum/config" }}
      {{- if or $chartManagedConfig $podAnnotations .Values.forceRestartOnUpgrade }}
      annotations:
        {{- with $podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.forceRestartOnUpgrade }}
        # Changes on every upgrade so a moved image tag (e.g. `latest`) is re-pulled.
        quoter-bot.morpho.org/restarted-at: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
        {{- end }}
        {{- if $chartManagedConfig }}
        # Configuration is read once at startup and the file is mounted through subPath, so a
        # config change must roll the pod; the reserved checksum wins over custom annotations.
        checksum/config: {{ include "quoter-bot.configYaml" . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "quoter-bot.selectorLabels" . | nindent 8 }}
    spec:
      # The bot never talks to the Kubernetes API; cloud workload-identity webhooks (IRSA, EKS
      # Pod Identity) inject their own projected tokens independently of this flag.
      automountServiceAccountToken: false
      serviceAccountName: {{ include "quoter-bot.serviceAccountName" . | quote }}
      # SIGTERM shutdown serializes up to three receipt-bounded waits through the shared
      # operation queue — the in-flight cycle's transaction, then the bootstrap cleanup batch,
      # then the ladder cleanup batch — so when the chart-managed config declares
      # setup.transactionReceiptTimeoutMs, the grace period is floored to three receipt
      # timeouts plus a two-minute drain buffer. Each additional owned group adds another
      # bounded wait, and environment-supplied or existingConfigSecret timeouts are invisible
      # here: size terminationGracePeriodSeconds explicitly for those workloads.
      {{- $receiptMs := 0 }}
      {{- if and .Values.config (not .Values.existingConfigSecret) }}
      {{- $receiptMs = int (dig "setup" "transactionReceiptTimeoutMs" 0 .Values.config) }}
      {{- end }}
      {{- $grace := int .Values.terminationGracePeriodSeconds }}
      {{- $graceFloor := add (mul (div $receiptMs 1000) 3) 120 }}
      {{- if and (gt $receiptMs 0) (lt $grace $graceFloor) }}
      {{- $grace = $graceFloor }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $grace }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.volumePermissions.enabled }}
      initContainers:
        # Mirrors the image's railway-entrypoint.sh chown without changing state-file modes.
        # The runtime container itself never runs as root. Root plus CHOWN/DAC_OVERRIDE (to
        # change ownership and traverse 0700 state directories) is the minimum this needs, so
        # the default chart fits the Baseline Pod Security Standard, not Restricted — see the
        # chart README for the Restricted-compatible pre-owned-volume path.
        - name: volume-permissions
          image: {{ include "quoter-bot.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/bin/chown
            - -R
            - '{{ .Values.podSecurityContext.runAsUser | default 1000 }}:{{ .Values.podSecurityContext.runAsGroup | default 1000 }}'
            - {{ .Values.persistence.mountPath | quote }}
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
          volumeMounts:
            - name: state
              mountPath: {{ .Values.persistence.mountPath | quote }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "quoter-bot.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- if include "quoter-bot.hasConfigFile" . }}
            # Root flags precede the command; the mounted file uses the bot's native schema.
            - --config
            - /repo/bots/quoter-bot/quoter-bot.yaml
            {{- end }}
            {{- range .Values.args }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Durable offer-group ownership state lives on the state volume. The variable name
            # is reserved: custom `env` entries with this name are filtered out so state cannot
            # be silently detached from the retained PVC.
            - name: XDG_STATE_HOME
              value: {{ .Values.persistence.mountPath | quote }}
            {{- $extraEnv := list }}
            {{- range .Values.env }}
            {{- if ne .name "XDG_STATE_HOME" }}
            {{- $extraEnv = append $extraEnv . }}
            {{- end }}
            {{- end }}
            {{- with $extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: {{ .Values.persistence.mountPath | quote }}
            # The root filesystem is read-only; give Node a writable /tmp.
            - name: tmp
              mountPath: /tmp
            {{- if include "quoter-bot.hasConfigFile" . }}
            # subPath yields a regular file: the bot opens its config with O_NOFOLLOW and
            # rejects the symlinks a plain Secret volume mount would expose.
            - name: config
              mountPath: /repo/bots/quoter-bot/quoter-bot.yaml
              subPath: quoter-bot.yaml
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: state
          {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            # Quoted: a numeric-looking name must stay a YAML string.
            claimName: {{ .Values.persistence.existingClaim | quote }}
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-state" (include "quoter-bot.fullname" .) | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if include "quoter-bot.hasConfigFile" . }}
        - name: config
          secret:
            # Quoted: a numeric-looking name must stay a YAML string.
            secretName: {{ include "quoter-bot.configSecretName" . | quote }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
