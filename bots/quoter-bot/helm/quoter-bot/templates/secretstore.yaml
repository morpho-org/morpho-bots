{{- if .Values.externalSecret.enabled }}
{{- if not .Values.serviceAccount.create }}
{{- fail "externalSecret.enabled requires serviceAccount.create: the SecretStore authenticates as the chart-managed ServiceAccount (auth.jwt.serviceAccountRef)" }}
{{- end }}
{{- if not (index (.Values.serviceAccount.annotations | default (dict)) "eks.amazonaws.com/role-arn") }}
{{- fail "externalSecret.enabled requires serviceAccount.annotations[\"eks.amazonaws.com/role-arn\"]: the SecretStore authenticates with the ServiceAccount's IRSA role" }}
{{- end }}
{{- if not .Values.externalSecret.remoteKey }}
{{- fail "externalSecret.enabled requires externalSecret.remoteKey: the AWS Secrets Manager secret name or ARN" }}
{{- end }}
{{- if not .Values.externalSecret.region }}
{{- fail "externalSecret.enabled requires externalSecret.region: the AWS region of remoteKey" }}
{{- end }}
# Namespaced SecretStore authenticating as the chart-managed ServiceAccount; IRSA turns its
# projected token into the bot's IAM role.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "quoter-bot.secretStoreName" . | quote }}
  labels:
    {{- include "quoter-bot.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "quoter-bot.serviceAccountName" . | quote }}
{{- end }}
