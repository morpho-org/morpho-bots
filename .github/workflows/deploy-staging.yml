name: Deploy staging

# Every commit that lands on main redeploys every bot with a staging environment in
# packages/ci-scripts/manifest.json to its Railway staging environment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Select:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.manifest.outputs.targets }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup
        with:
          install: 'false'
          build-contracts: 'false'
      - name: Install ci-scripts
        run: pnpm install --filter @repo/ci-scripts --frozen-lockfile --ignore-scripts
      - name: Read the staging manifest
        id: manifest
        run: pnpm --filter @repo/ci-scripts run release-manifest staging

  Deploy:
    needs: Select
    name: ${{ matrix.bot }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.Select.outputs.targets) }}
    # Staging never releases or publishes an image (no release_pr / publish_image, so those callee
    # jobs are skipped), but a called workflow's declared permissions must still fit inside the
    # caller job's grant.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/deploy-bot.yml
    # Environment secrets (RAILWAY_TOKEN) only populate in the reusable workflow when the callee job
    # declares `environment:` AND the caller passes `secrets: inherit`. Environment *variables*
    # (RAILWAY_PROJECT_ID) flow without it. See https://github.com/actions/runner/issues/1490.
    secrets: inherit
    with:
      bot: ${{ matrix.bot }}
      package: ${{ matrix.package }}
      stage: ${{ matrix.stage }}
      github_environment: ${{ matrix.environment }}
      ref: ${{ github.sha }}
