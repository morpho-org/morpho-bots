name: Deploy staging

# Every commit that lands on main redeploys all bots to their Railway staging environment.
# Main is already green (the merge queue gates checks.yml); the queue's gh-readonly-queue/* refs
# fire merge_group, not push, so this runs once per merged PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blue-liq:
    uses: ./.github/workflows/deploy-bot.yml
    # Environment secrets (RAILWAY_TOKEN) only populate in the reusable workflow when the callee job
    # declares `environment:` AND the caller passes `secrets: inherit`. Environment *variables*
    # (RAILWAY_PROJECT_ID) flow without it, which is why the token — and only the token — came through
    # empty before. See https://github.com/actions/runner/issues/1490.
    secrets: inherit
    with:
      bot: blue-liq
      stage: staging
      ref: ${{ github.sha }}

  blue-realloc:
    uses: ./.github/workflows/deploy-bot.yml
    secrets: inherit
    with:
      bot: blue-realloc
      stage: staging
      ref: ${{ github.sha }}

  midnight-liq:
    uses: ./.github/workflows/deploy-bot.yml
    secrets: inherit
    with:
      bot: midnight-liq
      stage: staging
      ref: ${{ github.sha }}

  crossed-books:
    uses: ./.github/workflows/deploy-bot.yml
    secrets: inherit
    with:
      bot: crossed-books
      stage: staging
      github_environment: crossed-books-staging
      ref: ${{ github.sha }}
