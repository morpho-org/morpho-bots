name: Deploy market-making

# Publishes the market-making bot image to Docker Hub when a `market-making-*` GitHub release is
# published (repo CalVer convention: `market-making-YYYY.MM.DD-N`), or on manual dispatch. Unlike
# the Railway bots (deploy-bot.yml), "deploy" here means publish only: operators pull and run the
# image themselves (see bots/market-making/README.md), so there is no service to restart. The same
# release publish also fires release-slack-notify.yml, so one `gh release create` announces and
# ships in one step.
#
# The release MUST be created by a user (`gh release create` or the releases UI): GitHub does not
# run workflows for events raised with the repository GITHUB_TOKEN, so a release cut by another
# workflow with that token would never publish an image. workflow_dispatch stays as the escape
# hatch for exactly that case and for re-publishing, e.g.
# `gh workflow run deploy-market-making.yml -f tag=latest`.
#
# A release publish builds the tagged commit and pushes `<release tag>` plus `git-<shortsha>`, and
# moves `latest` unless the release is marked a prerelease. A dispatch builds the dispatched ref
# and pushes the `tag` input (default `latest`) plus `git-<shortsha>`.
#
# Credentials live in the `market-making-production` GitHub Environment: secrets DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN (a Docker Hub access token, write scope) plus variable DOCKERHUB_REPOSITORY
# (`<namespace>/<name>`, e.g. `morphoorg/market-making-bot`). In the environment's deployment
# branches/tags policy allow branch `main` AND tags matching `market-making-*` — release runs
# execute on the tag ref, so a branch-only policy rejects them.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Movable primary tag to publish alongside the immutable git-<sha> tag
        required: false
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  # Serialize publishes so two runs can't interleave their pushes of the movable tag.
  group: deploy-market-making
  cancel-in-progress: false

jobs:
  Publish:
    # Releases are repo-wide (the Railway bots cut `blue-liq-*` etc.); only market-making tags
    # concern this image. Other releases simply skip this job.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'market-making-') }}
    runs-on: ubuntu-latest
    environment: market-making-production
    steps:
      # On a release event this checks out the tagged commit (github.sha is the tag's commit), so
      # the image is built from exactly the released tree, not main HEAD.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The token reaches docker via stdin only — never argv, never a workflow-file literal.
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?set secret DOCKERHUB_USERNAME on the market-making-production environment}"
          : "${DOCKERHUB_TOKEN:?set secret DOCKERHUB_TOKEN on the market-making-production environment}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      # The build context is the repo root so the bun workspace (packages/*) resolves — see
      # bots/market-making/Dockerfile. The docker release tag is the git tag verbatim, so the
      # image, git tag, and GitHub release cross-reference with zero transformation.
      - name: Build and push
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          DISPATCH_TAG: ${{ inputs.tag || 'latest' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${REPOSITORY:?set variable DOCKERHUB_REPOSITORY on the market-making-production environment}"
          # Docker Hub `<namespace>/<name>` only. A dotted (or `localhost`) first component would be
          # read by docker as a registry host and silently push somewhere other than Docker Hub.
          echo "$REPOSITORY" | grep -Eq '^[a-z0-9]+((_|__|-+)[a-z0-9]+)*/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*$' \
            || { echo "DOCKERHUB_REPOSITORY must be a lowercase Docker Hub <namespace>/<name> repository" >&2; exit 1; }
          if [ "$EVENT" = "release" ]; then
            tags=("$RELEASE_TAG")
            # A prerelease publishes its own tag only; `latest` keeps tracking full releases.
            [ "$PRERELEASE" = "true" ] || tags+=("latest")
          else
            tags=("$DISPATCH_TAG")
          fi
          tags+=("git-${SHA:0:7}")
          build_args=()
          for tag in "${tags[@]}"; do
            echo "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' \
              || { echo "invalid docker tag: $tag" >&2; exit 1; }
            build_args+=(--tag "$REPOSITORY:$tag")
          done
          echo "Building ${tags[*]} from $SHA…"
          docker build --file bots/market-making/Dockerfile "${build_args[@]}" .
          for tag in "${tags[@]}"; do
            docker push "$REPOSITORY:$tag"
            echo "Published docker.io/$REPOSITORY:$tag"
          done
