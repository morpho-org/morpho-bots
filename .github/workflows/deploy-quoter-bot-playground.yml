name: Deploy quoter-bot playground to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - bots/quoter-bot/**
      - packages/bot-kit/**
      - packages/logging/**
      - packages/monitoring/**
      - packages/observability/**
      - packages/offers/**
      - packages/utils/**
      - packages/typescript-config/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .github/actions/setup/action.yml
      - .github/workflows/deploy-quoter-bot-playground.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and upload Pages artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-contracts: 'false'

      - name: Test playground at the GitHub Pages subpath
        run: PLAYGROUND_SMOKE_BASE_PATH=/morpho-bots/ pnpm --filter @morpho-org/quoter-bot run playground:smoke:test

      - name: Build playground
        run: pnpm --filter @morpho-org/quoter-bot run playground:build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: bots/quoter-bot/playground/dist
          retention-days: 1

  deploy:
    name: Deploy Pages artifact
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages
