name: Release Slack Notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)notify
        required: true

permissions:
  contents: read

env:
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_RELEASE_CHANNEL_ID: ${{ vars.SLACK_RELEASE_CHANNEL_ID }}

jobs:
  Notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = process.env.SLACK_BOT_TOKEN;
            const channel = process.env.SLACK_RELEASE_CHANNEL_ID;
            if (!token || !channel) {
              core.warning('SLACK_BOT_TOKEN or SLACK_RELEASE_CHANNEL_ID unset; skipping.');
              return;
            }

            const { owner, repo } = context.repo;

            // --- Slack Web API (fail-soft: warn, never fail the job) ---
            async function slack(method, body) {
              try {
                const res = await fetch(`https://slack.com/api/${method}`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json; charset=utf-8',
                    Authorization: `Bearer ${token}`,
                  },
                  body: JSON.stringify(body),
                });
                const json = await res.json();
                if (!json.ok) {
                  core.warning(`Slack ${method} failed: ${json.error}`);
                  return null;
                }
                return json;
              } catch (err) {
                core.warning(`Slack ${method} threw: ${err.message}`);
                return null;
              }
            }

            // Resolve the release: from the event payload, or by tag on manual dispatch.
            let release = context.payload.release;
            if (!release) {
              const tag = context.payload.inputs && context.payload.inputs.tag;
              if (!tag) {
                core.warning('No release payload or tag input; nothing to do.');
                return;
              }
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = data;
            }

            const escapeSlack = (s) =>
              String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // GitHub markdown -> Slack mrkdwn. The release body is maintainer-authored, so we
            // intentionally emit <url|text> link tokens rather than escaping it.
            const prBase = `https://github.com/${owner}/${repo}/pull`;
            const toMrkdwn = (md) =>
              (md || '')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<$2|$1>') // [text](url) -> <url|text>
                .replace(/(\*\*|__)(.+?)\1/g, '*$2*') // **bold**/__bold__ -> *bold*
                .replace(/^#{1,6}\s*(.+)$/gm, '*$1*') // headers -> bold
                .replace(/(^|\s)#(\d+)\b/g, `$1<${prBase}/$2|#$2>`) // #123 -> PR link
                .replace(/^\s*[-*]\s+/gm, '• ') // bullets
                .replace(/\n?_Generated by Claude[^\n]*$/i, '') // strip footer if present
                .trim();

            const title = escapeSlack(release.name || release.tag_name);
            const text = [
              `:package: *${title}*`,
              '',
              toMrkdwn(release.body),
              '',
              `<${release.html_url}|View full release notes on GitHub>`,
            ].join('\n');

            const res = await slack('chat.postMessage', {
              channel,
              text,
              unfurl_links: false,
              unfurl_media: false,
            });
            if (res) core.info(`Posted release "${title}" to Slack.`);
