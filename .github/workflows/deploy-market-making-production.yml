name: Deploy market-making production

# Reusable deploy-only job for market-making's single Railway environment. Production's release
# selector calls this workflow after a `release-market-making` label lands on main.

on:
  workflow_call:
    inputs:
      ref:
        description: Git SHA/ref to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-market-making-production
  cancel-in-progress: false

jobs:
  Deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: market-making-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-contracts: 'false'

      - name: Configure Railway CLI
        run: |
          mkdir -p "$RUNNER_TEMP/railway-bin"
          cat > "$RUNNER_TEMP/railway-bin/railway" <<'EOF'
          #!/usr/bin/env sh
          exec pnpm --silent dlx @railway/cli@5.30.4 "$@"
          EOF
          chmod +x "$RUNNER_TEMP/railway-bin/railway"
          echo "$RUNNER_TEMP/railway-bin" >> "$GITHUB_PATH"

      - name: Deploy
        env:
          DEPLOY_ONLY: 'true'
          RAILWAY_ENVIRONMENT: production
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: pnpm --filter @morpho-org/market-making-bot run deploy:railway
