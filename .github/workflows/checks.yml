name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  merge_group:

env:
  CI: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup
        uses: ./.github/actions/setup

      - name: Run lint
        run: pnpm lint

      - name: Run format check
        run: pnpm format:check

  Typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: pnpm -r run typecheck

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Foundry (includes anvil)
        # v1.9.1: runs the built foundryup directly instead of `bash foundryup`, which broke when
        # upstream foundryup became a binary (older pins fail with "cannot execute binary file").
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # anvil 1.4.4 rejects same-nonce EIP-1559 replacements ("nonce lower than current"), which
          # breaks the pending-queue bump/replace fork test (real nodes + anvil >=1.5 accept them).
          version: v1.5.1

      - name: Run contract tests
        run: forge test --root packages/contracts -vv

      - name: Run unit tests
        run: pnpm test
        env:
          # Base (chain 8453) archive RPC for the midnight-liquidation fork suite, which forks at a
          # pinned block and fails loud if this is unset. See test/fork/harness.ts.
          RPC_URL_8453: ${{ secrets.RPC_URL_8453 }}

      - name: Run browser smoke tests
        run: pnpm --filter @morpho-org/quoter-bot run playground:smoke:test

  Dead-Code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup
        uses: ./.github/actions/setup

      - name: Check for unused code and dependencies
        run: pnpm knip
