name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  merge_group:

env:
  CI: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup
        uses: ./.github/actions/setup

      - name: Run lint
        run: bun lint

      - name: Run format check
        run: bun format:check

  Typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: bun run --filter '*' typecheck

  Unit-Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Foundry (includes anvil)
        uses: foundry-rs/foundry-toolchain@8789b3e21e6c11b2697f5eb56eddae542f746c10 # v1
        with:
          # anvil 1.4.4 rejects same-nonce EIP-1559 replacements ("nonce lower than current"), which
          # breaks the pending-queue bump/replace fork test (real nodes + anvil >=1.5 accept them).
          version: v1.5.1

      - name: Run unit tests
        run: bun test
        env:
          # Base (chain 8453) archive RPC for the midnight-liquidation fork suite, which forks at a
          # pinned block and fails loud if this is unset. See test/fork/harness.ts.
          RPC_URL_8453: ${{ secrets.RPC_URL_8453 }}

      - name: Run monitor-bot unit tests (vitest)
        # monitor-bot is excluded from `bun test` (root bunfig [test].pathIgnorePatterns) because
        # its NestJS suite needs vitest's SWC transform for decorator metadata.
        run: bun run --filter @morpho-org/monitor-bot test

  Dead-Code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup
        uses: ./.github/actions/setup

      - name: Check for unused code and dependencies
        run: bun knip
