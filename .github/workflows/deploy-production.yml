name: Deploy production

# A PR whose description says `Releases <bot>` (bot ids in packages/ci-scripts/manifest.json)
# redeploys that bot to production when it merges, then cuts GitHub release `<bot>-<PR#>` and posts
# it to Slack. The description lands in the squash commit (repo setting: squash message = PR body),
# so `Gate` reads the intent from the pushed commit, binds it to the merged PR, and authorizes a bot
# only if a reviewer other than the author approved the PR *after* the intent was added. Intent
# edited in after the last approval is refused with a comment on the PR and deploys nothing. Logic:
# packages/ci-scripts/src/release-intent/orchestrate/gate.ts.
#
# Triggered on push:main (not pull_request:closed) so the run's ref is refs/heads/main — satisfying
# the main-only environment branch policy — and so the gate runs reviewed workflow code. There is no
# manual dispatch: it would bypass the gate. Re-ship or roll back with a new PR carrying the intent.
#
# A quoter-bot release also pushes the bot image to Docker Hub after the Railway deploy and release
# succeed; publish-quoter-bot-npm.yml (a workflow_run chain, kept standalone for npm trusted
# publishing) then publishes the CLI when the commit carries a quoter-bot release tag.
#
# No concurrency group, deliberately: GitHub keeps only ONE pending run per group, so serializing
# on the ref would silently drop a release push whenever a third push lands. Release tags carry the
# PR number, so runs need no shared counter; per-bot deploys serialize inside deploy-bot.yml.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  Gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      # JSON deploy-bot.yml matrix legs for the authorized bots; `[]` when nothing releases.
      targets: ${{ steps.gate.outputs.targets }}
      # JSON array of authorized bot ids, for per-bot follow-up jobs.
      bots: ${{ steps.gate.outputs.bots }}
      pr: ${{ steps.gate.outputs.pr }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
        with:
          install: 'false'
          build-contracts: 'false'
      - name: Install ci-scripts
        # --ignore-scripts skips the repo-root husky `prepare`; @repo/ci-scripts runs via tsx.
        run: pnpm install --filter @repo/ci-scripts --frozen-lockfile --ignore-scripts
      - name: Evaluate release intent
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @repo/ci-scripts run release-gate

  Deploy:
    needs: Gate
    if: ${{ needs.Gate.outputs.targets != '[]' }}
    # Job display name "<bot>", so the nested jobs read "<bot> / Deploy", "<bot> / Release" —
    # publish-quoter-bot-npm.yml proves a release by the "quoter-bot / Release" job name.
    name: ${{ matrix.bot }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.Gate.outputs.targets) }}
    # The callee's Release job needs contents:write; a called workflow can never hold more than its
    # caller job grants.
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-bot.yml
    # Environment secrets (RAILWAY_TOKEN) only populate in the reusable workflow when the callee job
    # declares `environment:` AND the caller passes `secrets: inherit`. Environment *variables*
    # (RAILWAY_PROJECT_ID) flow without it. See https://github.com/actions/runner/issues/1490.
    secrets: inherit
    with:
      bot: ${{ matrix.bot }}
      package: ${{ matrix.package }}
      stage: ${{ matrix.stage }}
      github_environment: ${{ matrix.environment }}
      ref: ${{ github.sha }}
      release_pr: ${{ needs.Gate.outputs.pr }}

  Quoter-bot-image:
    # Publishes image tags only after the quoter-bot deploy and its GitHub release both succeeded;
    # the image never gates the release.
    needs: [Gate, Deploy]
    if: ${{ contains(fromJSON(needs.Gate.outputs.bots), 'quoter-bot') }}
    # The OIDC token minting (id-token) the Docker Hub login needs must be granted by the caller.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-quoter-bot-dockerhub.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
