name: Deploy production

# A PR merged to main carrying a `release-{bot}` label redeploys that bot to production and cuts a
# GitHub release + git tag (CalVer `{bot}-YYYY.MM.DD-N`). Triggered on push:main (not
# pull_request:closed) so the run's ref is refs/heads/main — satisfying a main-only environment
# branch policy and giving the correct main HEAD in github.sha. Releasing publishes the tag, which
# fires release-slack-notify.yml. Runs on every push; when no release-* label is present, the
# deploy jobs are simply skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bot:
        description: Bot to release to production
        required: true
        type: choice
        options:
          - blue-liq
          - midnight-liq
          - crossed-books
          - market-making

permissions:
  contents: read

concurrency:
  # Serialize production runs so same-day CalVer `N` computation can't race between runs.
  group: deploy-production
  cancel-in-progress: false

jobs:
  Select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Output keys use underscores — a `-` in an Actions expression is the subtraction operator.
      blue_liq: ${{ steps.pick.outputs.blue_liq }}
      midnight_liq: ${{ steps.pick.outputs.midnight_liq }}
      crossed_books: ${{ steps.pick.outputs.crossed_books }}
      market_making: ${{ steps.pick.outputs.market_making }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          DISPATCH_BOT: ${{ github.event.inputs.bot }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            labels="release-$DISPATCH_BOT"
          else
            # Labels of the PR whose merge produced this commit.
            labels="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].labels[].name' 2>/dev/null || true)"
          fi
          has() { echo "$labels" | grep -qx "release-$1" && echo true || echo false; }
          {
            echo "blue_liq=$(has blue-liq)"
            echo "midnight_liq=$(has midnight-liq)"
            echo "crossed_books=$(has crossed-books)"
            echo "market_making=$(has market-making)"
          } >> "$GITHUB_OUTPUT"

  Blue:
    needs: Select
    if: ${{ needs.Select.outputs.blue_liq == 'true' }}
    uses: ./.github/workflows/deploy-bot.yml
    # Environment secrets (RAILWAY_TOKEN) only populate in the reusable workflow when the callee job
    # declares `environment:` AND the caller passes `secrets: inherit`. Environment *variables*
    # (RAILWAY_PROJECT_ID) flow without it, which is why the token — and only the token — came through
    # empty before. See https://github.com/actions/runner/issues/1490.
    secrets: inherit
    with:
      bot: blue-liq
      stage: production
      ref: ${{ github.sha }}

  Midnight:
    needs: Select
    if: ${{ needs.Select.outputs.midnight_liq == 'true' }}
    uses: ./.github/workflows/deploy-bot.yml
    secrets: inherit
    with:
      bot: midnight-liq
      stage: production
      ref: ${{ github.sha }}

  Crossed-books:
    needs: Select
    if: ${{ needs.Select.outputs.crossed_books == 'true' }}
    uses: ./.github/workflows/deploy-bot.yml
    secrets: inherit
    with:
      bot: crossed-books
      stage: production
      github_environment: crossed-books-prod
      ref: ${{ github.sha }}

  # Preflight BEFORE the Railway deploy: a labeled market-making merge must carry a new CalVer
  # package version and usable App credentials, or production would update while the GitHub
  # release, Docker Hub image, and Slack announcement never come to exist. Failing here leaves
  # production untouched and the operator fixes the version bump or credentials, then re-labels.
  Market-making-preflight:
    needs: Select
    if: ${{ needs.Select.outputs.market_making == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
      - name: Validate release version and tag availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./bots/market-making/package.json').version")"
          echo "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[1-9][0-9]*$' \
            || { echo "market-making package version must use CalVer YYYY.MM.DD-N (got: $version) — bump it in the release PR" >&2; exit 1; }
          if gh release view "market-making-$version" >/dev/null 2>&1; then
            echo "release market-making-$version already exists — bump the package version in the release PR" >&2
            exit 1
          fi
      # Proving the App credentials mint BEFORE deploying: Release-market-making refuses the
      # default-token fallback (its releases cannot trigger the image publish), so missing
      # credentials must stop the flow while production is still untouched.
      - name: Mint app installation token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.GIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GIT_BOT_PRIVATE_KEY }}

  Market-making:
    needs: Market-making-preflight
    uses: ./.github/workflows/deploy-market-making-production.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}

  Release-blue:
    # A skipped/failed Blue deploy skips this job too, so a bot is never tagged unless it deployed.
    needs: Blue
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Create release
        env:
          BOT: blue-liq
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          date="$(date -u +%Y.%m.%d)"
          n=$(( $(git tag -l "${BOT}-${date}-*" | wc -l) + 1 ))
          tag="${BOT}-${date}-${n}"
          # `|| true` guards against SIGPIPE aborting the job under `set -o pipefail` (git is
          # killed when head closes the pipe early once there are many tags).
          prev="$(git tag -l "${BOT}-*" --sort=-version:refname | head -n 1 || true)"
          echo "Creating release $tag (previous: ${prev:-none})"
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes \
            ${prev:+--notes-start-tag "$prev"}

  Release-midnight:
    needs: Midnight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Create release
        env:
          BOT: midnight-liq
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          date="$(date -u +%Y.%m.%d)"
          n=$(( $(git tag -l "${BOT}-${date}-*" | wc -l) + 1 ))
          tag="${BOT}-${date}-${n}"
          # `|| true` guards against SIGPIPE aborting the job under `set -o pipefail` (git is
          # killed when head closes the pipe early once there are many tags).
          prev="$(git tag -l "${BOT}-*" --sort=-version:refname | head -n 1 || true)"
          echo "Creating release $tag (previous: ${prev:-none})"
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes \
            ${prev:+--notes-start-tag "$prev"}

  Release-crossed-books:
    needs: Crossed-books
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Create release
        env:
          BOT: crossed-books
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          date="$(date -u +%Y.%m.%d)"
          n=$(( $(git tag -l "${BOT}-${date}-*" | wc -l) + 1 ))
          tag="${BOT}-${date}-${n}"
          # `|| true` guards against SIGPIPE aborting the job under `set -o pipefail` (git is
          # killed when head closes the pipe early once there are many tags).
          prev="$(git tag -l "${BOT}-*" --sort=-version:refname | head -n 1 || true)"
          echo "Creating release $tag (previous: ${prev:-none})"
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes \
            ${prev:+--notes-start-tag "$prev"}

  Release-market-making:
    needs: Market-making
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # Unlike the Railway-only bots above, a market-making release must FIRE downstream `release`
      # workflows: deploy-market-making.yml publishes the Docker Hub image and then announces on
      # Slack. Events created with the default GITHUB_TOKEN never trigger workflows, so mint the
      # same App installation token tag-releases.yml uses — and FAIL here rather than fall back to
      # the default token, which would mint a release that can never grow its operator image. The
      # preflight job already proved these credentials mint, so a failure here is transient; re-run
      # this job once it clears.
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.GIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GIT_BOT_PRIVATE_KEY }}
      - name: Create release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: market-making
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./bots/market-making/package.json').version")"
          echo "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[1-9][0-9]*$' \
            || { echo "market-making package version must use CalVer YYYY.MM.DD-N" >&2; exit 1; }
          tag="${BOT}-${version}"
          # `|| true` guards against SIGPIPE aborting the job under `set -o pipefail` (git is
          # killed when head closes the pipe early once there are many tags).
          prev="$(git tag -l "${BOT}-*" --sort=-version:refname | head -n 1 || true)"
          echo "Creating release $tag (previous: ${prev:-none})"
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes \
            ${prev:+--notes-start-tag "$prev"}
