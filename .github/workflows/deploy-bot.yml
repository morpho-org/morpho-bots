name: Deploy bot

# Reusable deploy-only job. Ships the checked-out working tree to a bot's Railway environment via
# `railway up` (Railway builds server-side). Sets no variables or secrets — the environment must
# already be provisioned by a full run of that bot's bots/<bot>/scripts/deploy-railway.ts.
# It runs that same script in DEPLOY_ONLY mode, which re-ships services and touches nothing else. The
# only credential is a RAILWAY_TOKEN scoped to the target project + environment, read from the
# per-bot-per-stage GitHub Environment (never passed by callers, never a fork-readable repo secret).

on:
  workflow_call:
    inputs:
      bot:
        description: Which bot to deploy (blue-liq | midnight-liq | crossed-books)
        required: true
        type: string
      stage:
        description: Target stage (staging | production)
        required: true
        type: string
      github_environment:
        description: GitHub Environment override (defaults to <bot>-<stage>)
        required: false
        type: string
        default: ''
      ref:
        description: Git SHA/ref to deploy (defaults to the triggering ref)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  Deploy:
    runs-on: ubuntu-latest
    # The GitHub Environment defaults to "<bot>-<stage>" and can be overridden for an established
    # environment name. It holds secret RAILWAY_TOKEN and var RAILWAY_PROJECT_ID; scope its
    # deployment branches to `main` so the token is unreachable from arbitrary PR branches.
    environment: ${{ inputs.github_environment || format('{0}-{1}', inputs.bot, inputs.stage) }}
    concurrency:
      group: deploy-${{ inputs.bot }}-${{ inputs.stage }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          # Deploy-only builds on Railway; the local @repo/contracts ABIs aren't needed here.
          build-contracts: 'false'

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.26.1

      - name: Deploy
        env:
          BOT: ${{ inputs.bot }}
          RAILWAY_ENVIRONMENT: ${{ inputs.stage }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Re-ship the pre-provisioned services only; set no secrets/variables (CI holds none).
          DEPLOY_ONLY: 'true'
        run: |
          set -euo pipefail
          # Map the stable bot id (also the release-label suffix) to its workspace package.
          case "$BOT" in
            blue-liq) pkg='@morpho-org/blue-liquidation' ;;
            midnight-liq) pkg='@morpho-org/midnight-liquidation' ;;
            crossed-books) pkg='@morpho-org/midnight-crossed-books' ;;
            *) echo "Unknown bot: $BOT" >&2; exit 1 ;;
          esac
          bun run --filter "$pkg" deploy:railway
