name: 'Setup'
description: 'Sets up the repository (pnpm + Node + Bun) and builds dist-emitting workspace packages'
inputs:
  install:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
  frozen-lockfile:
    description: 'Whether to use --frozen-lockfile when installing dependencies'
    required: false
    default: 'true'
  build-contracts:
    description: 'Whether to build @repo/contracts (skip for jobs that do not need its ABIs)'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    # pnpm owns installs, workspace resolution, and script running. The version comes from
    # package.json#packageManager, so it is not repeated here.
    #
    # `pnpm/setup` — not the older `pnpm/action-setup`, which upstream now scopes to pnpm v10 and
    # older. It downloads pnpm's self-contained release binary and verifies it against the SHA-256
    # digest GitHub publishes for the asset, instead of bootstrapping through `npm ci` of
    # `@pnpm/exe` — one fewer npm-registry artifact on the path that this migration exists to
    # shorten. `install: false` because the install step below is conditional on an input.
    - name: Set up pnpm
      uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
      with:
        install: false

    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc

    # bun remains the runtime and the test runner; pnpm only manages dependencies and tasks.
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: |
        pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '' }}

    - name: Build @repo/contracts
      if: ${{ inputs.build-contracts == 'true' }}
      shell: bash
      run: pnpm --filter @repo/contracts run build
