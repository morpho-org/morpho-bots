name: 'Setup'
description: 'Sets up the repository (pnpm + Node + Bun) and builds dist-emitting workspace packages'
inputs:
  install:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'
  frozen-lockfile:
    description: 'Whether to use --frozen-lockfile when installing dependencies'
    required: false
    default: 'true'
  build-contracts:
    description: 'Whether to build @repo/contracts (skip for jobs that do not need its ABIs)'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    # Version comes from package.json#packageManager.
    - name: Set up pnpm
      uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc

    # Bun remains the runtime + test runner (pnpm only manages dependencies).
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: |
        pnpm install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '' }}

    - name: Build @repo/contracts
      if: ${{ inputs.build-contracts == 'true' }}
      shell: bash
      run: pnpm --filter @repo/contracts run build
