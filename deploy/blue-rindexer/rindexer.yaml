name: blue_liquidation
description: >-
  Indexes the single Morpho Blue event the liquidation bot needs for borrower discovery, across every
  chain the bot runs on (Base + Robinhood): `Borrow`. It is the only path that creates debt and its
  indexed `onBehalf` is the position owner, so the bot takes the distinct (market id, onBehalf) set as
  the candidate universe and lets the on-chain lens filter to actually-liquidatable positions
  (over-inclusion is harmless; under-inclusion would miss liquidations). One rindexer process indexes
  all networks into ONE `blue_liquidation_morpho.borrow` table, discriminated by rindexer's standard
  `network` column; each per-chain bot filters on it (see packages/blue-liquidation/src/borrowers.ts). MarketParams
  (loanToken, collateralToken, oracle, irm, lltv) are recovered ON-CHAIN via `idToMarketParams(id)` on
  the singleton — NOT indexed. `CreateMarket` is deliberately NOT indexed: no-code rindexer cannot
  decode the nested `MarketParams` struct it carries (it panics with "CustomStruct ... not supported"),
  and since the singleton exposes `idToMarketParams` the event is unnecessary anyway.
project_type: no-code
networks:
  - name: base
    chain_id: 8453
    rpc: ${RINDEXER_RPC_URL_8453}
    # Cap per-request getLogs range. Sized for the Morpho eRPC `/cache` endpoint (wide-range friendly)
    # during the historical backfill — without it rindexer probes, hits the endpoint's max-range error,
    # and falls back to tiny 5000-block chunks, making the ~34M-block backfill glacial. For steady-state
    # live indexing on `/realtime` (small ranges near the tip) this cap never binds, so it is safe to
    # leave set across the /cache→/realtime switch.
    max_block_range: 150000
  - name: robinhood
    chain_id: 4663
    rpc: ${RINDEXER_RPC_URL_4663}
    # Robinhood (Arbitrum Orbit) is a young chain — the Morpho singleton is at block 286, so the
    # backfill is trivial and no max_block_range cap is needed.

storage:
  postgres:
    enabled: true

contracts:
  - name: Morpho
    # Shared across networks: both deployments are the same Morpho Blue ABI.
    abi: ./abis/morpho.abi.json
    details:
      - network: base
        address: '0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb'
        # Morpho Blue singleton deployment block on Base — VERIFIED via getCode (no code at
        # 13977147, code at 13977148), so this indexes from the singleton's first block: no early
        # markets/borrowers are missed.
        start_block: 13977148
      - network: robinhood
        # Robinhood's Morpho Blue singleton is at a DIFFERENT address than Base's canonical 0xBBBB…
        address: '0x9D53d5E3bd5E8d4Cbfa6DB1ca238AEA02E651010'
        start_block: 286
    include_events:
      - Borrow
