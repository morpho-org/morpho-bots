# Bundles the per-chain blue bots with ONE shared rindexer instance + Postgres for borrower
# discovery. rindexer indexes the Morpho Blue `Borrow` event (deploy/blue-rindexer/rindexer.yaml)
# for every chain into one Postgres, discriminated by a `network` column; each bot tick reads the
# indexed (market, borrower) pairs for its own chain. Each bot container runs a signer agent, the
# per-chain `queued` daemon, and the pipeline that feeds it —
# `<SOURCE_OP> | <TRANSFORM_OP> | morpho-queued submit`, defaulting to liquidation; logs go to stderr, and
# the daemon appends terminal outcomes to /data/morpho-bots/queued/outcomes-<chainId>.jsonl. Set the
# chainId-suffixed RPCs (RPC_URL_8453, RPC_URL_4663, optionally RINDEXER_RPC_URL_<chainId>), a
# SIGNER_PRIVATE_KEY (read only by morpho-signer), SIGNER_POLICY_JSON, and the matching
# LIQUIDATOR_ADDRESS the transform targets (the address that private key derives).
#
# Build contexts are `..` (the repo root — required for the bun workspace to resolve) because this
# file lives in deploy/; run it from anywhere: `docker compose -f deploy/docker-compose.blue.yml up`.
#
# NOTE: the rindexer service config (image command, env) follows the rindexer docs but has not been
# run end-to-end here; verify `docker compose up` against live RPCs before relying on it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rindexer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rindexer}
      POSTGRES_DB: blue_liquidation
    volumes:
      - rindexer-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rindexer -d blue_liquidation']
      interval: 5s
      timeout: 5s
      retries: 10

  rindexer:
    # Derived from the upstream rindexer image with rindexer.yaml + the generated event ABI baked in
    # (see deploy/blue-rindexer/Dockerfile), so no host bind mount is needed and the ABI isn't
    # committed.
    build:
      context: ..
      dockerfile: deploy/blue-rindexer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rindexer:${POSTGRES_PASSWORD:-rindexer}@postgres:5432/blue_liquidation
      # One shared indexer for both networks; each reads its own RPC (matches the ${RINDEXER_RPC_URL_*}
      # interpolations in rindexer.yaml). Defaults to that chain's bot RPC; Robinhood to its public RPC.
      RINDEXER_RPC_URL_8453: ${RINDEXER_RPC_URL_8453:-${RPC_URL_8453:?set RPC_URL_8453 or RINDEXER_RPC_URL_8453}}
      RINDEXER_RPC_URL_4663: ${RINDEXER_RPC_URL_4663:-${RPC_URL_4663:-https://rpc.mainnet.chain.robinhood.com}}
      PROJECT_PATH: /app/project_path
    # Mirrors the baked `CMD ["start","indexer"]` in the Dockerfile (keep in sync).
    command: ['start', 'indexer']
    restart: unless-stopped

  bot-base:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT: blue
      CHAIN_ID: '8453'
      TICK_INTERVAL_S: ${TICK_INTERVAL_S:-2}
      # The two op stages piped before `morpho-queued submit`; override to run a different behavior.
      # Which ops run is deployment policy, not baked into the core.
      SOURCE_OP: ${SOURCE_OP:-unhealthy-positions}
      TRANSFORM_OP: ${TRANSFORM_OP:-liquidate}
      RPC_URL: ${RPC_URL_8453:?set RPC_URL_8453}
      SIGNER_PRIVATE_KEY: ${SIGNER_PRIVATE_KEY:-}
      SIGNER_POLICY_JSON: ${SIGNER_POLICY_JSON:-}
      # The `liquidate` transform skims to this EOA and simulates `from` it (secret-free — no key on the op stages); it
      # must be the address the private key above derives, else the transform and daemon target different
      # wallets (the daemon cross-checks this against SIGNER_SOCKET when in agent mode).
      LIQUIDATOR_ADDRESS: ${LIQUIDATOR_ADDRESS:?set LIQUIDATOR_ADDRESS}
      EXECUTOOOR_ADDRESS: ${EXECUTOOOR_ADDRESS:-}
      # Disarm the daemon: run the full dedupe→re-sim→fee pipeline and emit `would_submit`, never
      # touching the signer. Unset/false = armed (default).
      QUEUED_DRY_RUN: ${QUEUED_DRY_RUN:-}
      SWAP_CONFIG_PATH: /data/morpho-bots/blue/swap-config.json
      ZEROX_API_KEY: ${ZEROX_API_KEY:-}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY:-}
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      # The bot reads rindexer's indexed events (filtered to network=base) from the same Postgres.
      DATABASE_URL: postgresql://rindexer:${POSTGRES_PASSWORD:-rindexer}@postgres:5432/blue_liquidation
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional BetterStack log forwarding (deploy/vector.yaml). Empty = disabled; the entrypoint only
      # starts the Vector side-car when the token is set. Blue's two chains share one blue source.
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST:-}
    volumes:
      # One /data volume carries both the cross-tick state files and the swap config.
      - bot-base-data:/data
      - ${SWAP_CONFIG_PATH:-../packages/blue-liquidation/configs/example.json}:/data/morpho-bots/blue/swap-config.json:ro
    restart: unless-stopped
    # Worst-case in-flight tick + daemon drain on SIGTERM before the platform SIGKILLs (see the
    # entrypoint's interruptible-wait shutdown path).
    stop_grace_period: 60s

  # Robinhood launches DETECTION-ONLY: no swap route configured (no SWAP_CONFIG_PATH), so the bot
  # discovers + logs liquidatable positions but skips every routed liquidation. It still needs the
  # Executor deployed on Robinhood (deploy:executor) to pass the startup liveness gate.
  bot-robinhood:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT: blue
      CHAIN_ID: '4663'
      TICK_INTERVAL_S: ${TICK_INTERVAL_S:-2}
      SOURCE_OP: ${SOURCE_OP:-unhealthy-positions}
      TRANSFORM_OP: ${TRANSFORM_OP:-liquidate}
      RPC_URL: ${RPC_URL_4663:-https://rpc.mainnet.chain.robinhood.com}
      SIGNER_PRIVATE_KEY: ${SIGNER_PRIVATE_KEY:-}
      SIGNER_POLICY_JSON: ${SIGNER_POLICY_JSON:-}
      # Must be the address the private key above derives (see bot-base).
      LIQUIDATOR_ADDRESS: ${LIQUIDATOR_ADDRESS:?set LIQUIDATOR_ADDRESS}
      EXECUTOOOR_ADDRESS: ${EXECUTOOOR_ADDRESS:-}
      QUEUED_DRY_RUN: ${QUEUED_DRY_RUN:-}
      # The bot reads rindexer's indexed events (filtered to network=robinhood) from the same Postgres.
      DATABASE_URL: postgresql://rindexer:${POSTGRES_PASSWORD:-rindexer}@postgres:5432/blue_liquidation
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional BetterStack log forwarding (deploy/vector.yaml). Empty = disabled; the entrypoint only
      # starts the Vector side-car when the token is set. Blue's two chains share one blue source.
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST:-}
    volumes:
      - bot-robinhood-data:/data
    restart: unless-stopped
    # Worst-case in-flight tick + daemon drain on SIGTERM before the platform SIGKILLs.
    stop_grace_period: 60s

volumes:
  rindexer-pg:
  bot-base-data:
  bot-robinhood-data:
