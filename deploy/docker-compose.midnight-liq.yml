# Runs a signer agent, the per-chain `queued` daemon, and the pipeline that feeds it:
# `<SOURCE_OP> | <TRANSFORM_OP> | morpho-queued submit`, defaulting to liquidation.
# stdout carries JSON-Lines records, logs go to stderr, and the daemon appends terminal outcomes to
# /data/morpho-bots/queued/outcomes-<chainId>.jsonl.
# Borrower candidates come from the markets liquidation-candidates HTTP API
# (LIQUIDATION_CANDIDATES_API_URL, public by default), so there is no indexer or database to run.
# Build context is `..` (the repo root — required for the bun workspace to resolve) because this file
# lives in deploy/; run it from anywhere: `docker compose -f deploy/docker-compose.midnight-liq.yml up`.
services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BOT: midnight
      CHAIN_ID: '8453'
      TICK_INTERVAL_S: ${TICK_INTERVAL_S:-2}
      # The two op stages piped before `morpho-queued submit`; override to run a different behavior.
      # liquidation pair. Which ops run is deployment policy, not baked into the core.
      SOURCE_OP: ${SOURCE_OP:-unhealthy-positions}
      TRANSFORM_OP: ${TRANSFORM_OP:-liquidate}
      RPC_URL: ${RPC_URL:?set RPC_URL}
      SIGNER_PRIVATE_KEY: ${SIGNER_PRIVATE_KEY:-}
      SIGNER_POLICY_JSON: ${SIGNER_POLICY_JSON:-}
      # The `liquidate` transform skims to this EOA and simulates `from` it (secret-free — no key on the op stages); it
      # must be the address the private key above derives, else the transform and daemon target different
      # wallets (the daemon cross-checks this against SIGNER_SOCKET when in agent mode).
      LIQUIDATOR_ADDRESS: ${LIQUIDATOR_ADDRESS:?set LIQUIDATOR_ADDRESS}
      EXECUTOOOR_ADDRESS: ${EXECUTOOOR_ADDRESS:-}
      # Disarm the daemon: run the full dedupe→re-sim→fee pipeline and emit `would_submit`, never
      # touching the signer. Unset/false = armed (default).
      QUEUED_DRY_RUN: ${QUEUED_DRY_RUN:-}
      # Venues are enabled by the presence of their API key. LiFi also works keyless — set
      # ENABLE_LIFI=true to turn it on without a key (a LIFI_API_KEY only raises rate limits). With no
      # venue enabled, the bot refuses to start unless ALLOW_BAD_DEBT_ONLY=true (then bad-debt-only).
      ZEROX_API_KEY: ${ZEROX_API_KEY:-}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY:-}
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      ENABLE_LIFI: ${ENABLE_LIFI:-}
      ALLOW_BAD_DEBT_ONLY: ${ALLOW_BAD_DEBT_ONLY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional BetterStack log forwarding (deploy/vector.yaml). Empty = disabled; the entrypoint only
      # starts the Vector side-car when the token is set.
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST:-}
    volumes:
      # Cross-tick state; without it a container restart degrades to fresh-state semantics (safe).
      - bot-data:/data
    restart: unless-stopped
    # Worst-case in-flight tick + daemon drain on SIGTERM before the platform SIGKILLs (see the
    # entrypoint's interruptible-wait shutdown path).
    stop_grace_period: 60s

volumes:
  bot-data:
