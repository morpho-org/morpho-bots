# bun remains the runtime + test runner; pnpm owns installs (see pnpm-workspace.yaml).

# Without this, `bun test` engages bun's own install machinery on the pnpm-managed tree (triggered
# by the workspace `catalog:` protocol): it rewrites the root package.json with a bun-style
# workspaces/catalog block and lays broken partial copies of peer-instanced packages (viem and
# friends) into bots/*/node_modules WITHOUT their dependencies — the post-migration CI Test module
# resolution failures. pnpm's publicly hoisted layout already resolves everything; bun must never
# install here.
[install]
auto = "disable"
frozenLockfile = true

# Compile the liquidation bots' soltag `sol``` lens templates during `bun test` (each plugin
# self-scopes to its own bot's files, so both can be preloaded — other workspaces are untouched).
[test]
preload = [
  "./bots/midnight-liquidation/soltag.preload.ts",
  "./bots/blue-liquidation/soltag.preload.ts"
]
